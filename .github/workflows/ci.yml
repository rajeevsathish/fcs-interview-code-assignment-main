name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-assignment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Docker is preinstalled and running on GitHub-hosted ubuntu-latest runners,
      # so Quarkus dev-services/Testcontainers can start Postgres for
      # ProductEndpointTest, WarehouseEndpointIT and FulfillmentEndpointIT without
      # any extra setup here.
      - name: Build, run tests, and enforce coverage
        run: mvn -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/jacoco-report/
          retention-days: 14

      - name: Upload surefire/failsafe test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java-assignment/target/surefire-reports/
            java-assignment/target/failsafe-reports/
          retention-days: 14
