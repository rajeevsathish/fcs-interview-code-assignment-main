%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api

# quarkus-jacoco (test scope) needs this baked into the packaged app itself so that
# @QuarkusIntegrationTest, which runs the built jar as a separate external process under
# the default (prod) profile, writes coverage into the same exec file as the in-process
# @QuarkusTest runs. Failsafe's systemPropertyVariables only reach the test-launcher JVM,
# not that spawned process, and a %test.-prefixed key would never apply there since that
# process doesn't run under the test profile.
quarkus.jacoco.data-file=target/jacoco-quarkus.exec
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report-location=target/jacoco-report